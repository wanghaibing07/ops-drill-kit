name: checks
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portable:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Install project dependencies
        run: python -m pip install -r requirements.txt
      - name: Install shell test tools
        run: sudo apt-get update && sudo apt-get install -y shellcheck bats
      - name: Offline unit, shell and lint checks
        run: make PYTHON=python test-unit test-shell lint
      # Ownership checks require uid 0 but perform no fault injection.
      - name: Privileged offline checks
        run: sudo -n make test-privileged
